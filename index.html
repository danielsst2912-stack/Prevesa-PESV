<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PREVESA Inspección Mixers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: herramienta de campo — barra de marca arriba; inspección en una columna móvil; administración con banda oscura propia y matriz ancha */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D3DAE1;
  --fg:#17202A; --muted:#5C6773;
  --blue:#1E5AA8; --blue-soft:#E3ECF8; --green:#5E9A22; --green-soft:#E8F3DA;
  --red:#C2362B; --red-soft:#FBE5E2; --amber:#9A6A00; --amber-soft:#FBF0D6;
  --steel:#4A5058; --admin:#1E242B; --admin-fg:#F1F4F7;
  --plate:#F4C400; --plate-fg:#111; --on-accent:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --surface-2:#232C35; --line:#33404B;
  --fg:#E7ECF1; --muted:#97A3AF;
  --blue:#6FA2E8; --blue-soft:#1B2E47; --green:#9BD05A; --green-soft:#22331A;
  --red:#F07B70; --red-soft:#3D1F1C; --amber:#E7B54A; --amber-soft:#3A2E14;
  --steel:#B9C1CA; --admin:#0B0F13; --admin-fg:#F1F4F7; --on-accent:#0E1620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface-2:#232C35; --line:#33404B;
  --fg:#E7ECF1; --muted:#97A3AF;
  --blue:#6FA2E8; --blue-soft:#1B2E47; --green:#9BD05A; --green-soft:#22331A;
  --red:#F07B70; --red-soft:#3D1F1C; --amber:#E7B54A; --amber-soft:#3A2E14;
  --steel:#B9C1CA; --admin:#0B0F13; --admin-fg:#F1F4F7; --on-accent:#0E1620; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:26px} h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{background:#fff;border-radius:6px;padding:4px 8px;display:flex;align-items:center}
.logo img{height:40px;width:auto;display:block}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;line-height:1}
.brand span{font-size:12px;color:var(--muted)}
.nav{margin-left:auto;display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav button.adm[aria-pressed="true"]{background:var(--admin);color:var(--admin-fg)}

main{padding-block:22px 60px}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}

/* Plate */
.plate{display:inline-block;background:var(--plate);color:var(--plate-fg);font-family:var(--f-mono);font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:4px;border:2px solid #111;font-size:14px;line-height:1.3;white-space:nowrap}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{background:var(--green-soft);color:var(--green)}
.st-nc{background:var(--red-soft);color:var(--red)}
.st-pend{background:var(--amber-soft);color:var(--amber)}
.st-fix{background:var(--blue-soft);color:var(--blue)}

/* Inspector */
.steps{display:flex;flex-direction:column;gap:20px;max-width:760px;margin:0 auto}
.veh-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.veh{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer}
.veh[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.veh small{color:var(--muted);font-size:12.5px}
.sec-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.sec{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px;cursor:pointer}
.sec:hover{border-color:var(--blue)}
.sec .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--blue)}
.sec b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.sec small{color:var(--muted);font-size:12.5px}
.form-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.nc{background:var(--red-soft)}
.item .txt{min-width:0}
.item .obs{grid-column:1/-1}
.item .obs input{width:100%;background:var(--surface);border:1px solid var(--red);border-radius:6px;padding:8px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer;min-width:44px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].c{background:var(--green);color:var(--on-accent)}
.seg button[aria-pressed="true"].n{background:var(--red);color:var(--on-accent)}
.seg button[aria-pressed="true"].a{background:var(--steel);color:var(--surface)}
.items-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sigbox{border:2px dashed var(--line);border-radius:10px;background:#fff;position:relative;touch-action:none;height:180px}
.sigbox canvas{width:100%;height:100%;display:block;cursor:crosshair}
.sigbox .hint{position:absolute;left:14px;bottom:10px;color:#8a929b;font-size:12px;pointer-events:none}
.sigbox .line{position:absolute;left:14px;right:14px;bottom:30px;border-top:1px solid #c5cbd1;pointer-events:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.msg{padding:10px 14px;border-radius:8px;font-weight:500}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:30px 18px}
.done .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px}

/* Admin */
.admin-band{background:var(--admin);color:var(--admin-fg);margin-top:-22px;margin-bottom:22px}
.admin-band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.admin-band h2{color:var(--admin-fg)}
.admin-band .sub{color:#A9B4BF;font-size:13.5px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:#A9B4BF;padding:10px 16px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--red)} .kpi.good b{color:var(--green)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.cell{cursor:default}
td.cell button{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
td.cell small{font-size:11.5px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--green)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.find{display:flex;flex-direction:column;gap:12px}
.find-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px;display:grid;gap:12px}
.find-card.closed{border-left-color:var(--blue)}
.find-card .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.find-card ul{margin:0;padding-left:18px}
.inline-confirm{display:inline-flex;gap:6px;align-items:center}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:12px;max-width:720px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .box header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{display:flex;flex-direction:column}
.sigimg{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:340px;width:100%;height:auto}
.band-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.band-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.ghost{background:transparent;color:var(--admin-fg);border-color:#46515C}
.btn.ghost:hover{border-color:var(--admin-fg)}
.lock{max-width:420px;margin:10px auto 0;display:flex;flex-direction:column;gap:14px}
.lock .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--admin);color:var(--admin-fg)}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--blue);font-weight:600;cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:30}
@media (max-width:560px){
  .nav{margin-left:0;width:100%} .nav button{flex:1}
  .item{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn,.veh,.sec{transition:border-color .15s,background .15s}}

.login-sub{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;font-size:13px}
@media print{
  body *{visibility:hidden}
  .modal,.modal *{visibility:visible}
  .modal{position:absolute;inset:0;background:#fff;padding:0;display:block}
  .modal .box{max-width:none;border-radius:0}
  .no-print{display:none!important}
}
</style>
</head>

function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(iso){if(!iso)return"—";const [y,m,d]=String(iso).slice(0,10).split("-");return `${d}/${m}/${y}`}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fmtMes(k){const [y,m]=k.split("-");return MESES[+m-1]+" "+y}

function svgIcon(d){return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${d}"/></svg>`}

const pwField=(id,label,ac,type="password")=>`<label class="field"><span class="label">${label}</span><span class="pw"><input id="${id}" type="${type}" autocomplete="${ac}"><button type="button" data-eye="${id}">Ver</button></span></label>`;
function wireEyes(root){root.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"Ocultar":"Ver"})}
function errTxt(e){const m=(e&&(e.message||e.error_description))||"";
  if(/pin_invalido/.test(m))return"El PIN de inspectores no es correcto.";

/* Firma */
let sigCtx=null, sigDirty=false;
function initSig(){
  const c=$("#sig"); const r=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr; sigCtx=c.getContext("2d"); sigCtx.scale(dpr,dpr);
  sigCtx.lineWidth=2.2; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#0B2A5B";
  sigDirty=false;
  if(initSig.img){const im=new Image();im.onload=()=>{sigCtx.drawImage(im,0,0,r.width,r.height);sigDirty=true};im.src=initSig.img}
  let drawing=false,last=null;
  const pos=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);sigCtx.beginPath();sigCtx.arc(last.x,last.y,1,0,7);sigCtx.fillStyle="#0B2A5B";sigCtx.fill()};
  c.onpointermove=e=>{if(!drawing)return;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(last.x,last.y);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();last=p;sigDirty=true};
  const end=()=>{if(drawing){drawing=false;initSig.img=sigDirty?c.toDataURL("image/png"):null}};
  c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
  $("#sig-clear").onclick=()=>{sigCtx.clearRect(0,0,c.width,c.height);sigDirty=false;initSig.img=null};
}
function firmaPNG(){
  const c=$("#sig"); const out=document.createElement("canvas"); out.width=600; out.height=Math.round(600*c.height/c.width);
  const x=out.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,out.width,out.height); x.drawImage(c,0,0,out.width,out.height);
  return out.toDataURL("image/png");
}
async function enviar(){
  const f=S.form, s=SEC[f.sec], v=S.vehiculosInsp.find(x=>x.id===S.vehSel);
  const errs=[];
  if(!f.fecha) errs.push("la fecha");
  if(f.items.some(i=>!i.r)) errs.push("todos los ítems de la lista (C, NC o N/A)");
  if(f.items.some(i=>i.r==="NC"&&!i.obs.trim())) errs.push("la descripción de cada hallazgo NC");
  if(!f.inspector.trim()) errs.push("tu nombre");
  if(!f.cedula.trim()) errs.push("tu cédula");
  if(!sigDirty) errs.push("la firma");
  if(errs.length){f.error="Falta completar: "+errs.join(", ")+".";renderInsp();$(".msg.err")?.scrollIntoView({block:"center"});return}
  const btn=$("#f-send"); btn.disabled=true; btn.textContent="Enviando…";
  ls.set("prevesa_insp",JSON.stringify({inspector:f.inspector,cedula:f.cedula,cargo:f.cargo}));
  const firma=firmaPNG();
  const nc=f.items.filter(i=>i.r==="NC").length;
  const {error}=await sb.rpc("registrar_inspeccion",{p_pin:S.pin,p:{
    vehiculo_id:v.id, seccion:s.id, fecha:f.fecha, km:f.km, extra:f.extra,
    items:f.items.map(i=>({t:i.t,r:i.r,obs:i.obs.trim()})), obs:f.obs.trim(),
    inspector:f.inspector.trim(), cedula:f.cedula.trim(), cargo:f.cargo.trim(), firma }});
  if(error){ f.error="No se pudo enviar: "+errTxt(error); if(/pin_invalido/.test(error.message||"")){S.pinOk=false;S.pin=null;ls.set("prevesa_pin",null)} renderInsp(); return; }
  S.sent={placa:v.placa, sec:s.nombre, nc, firma}; S.form=null; initSig.img=null; renderInsp(); window.scrollTo({top:0});
  cargarEstadoVeh();
}

const COLS="id,vehiculo_id,placa,interno,seccion,fecha,km,extra,items,obs,nc,inspector,cedula,cargo,creado";
async function cargarAdmin(){
  const [v,i,s,c]=await Promise.all([
    sb.from("vehiculos").select("*").order("placa"),
    sb.from("inspecciones").select(COLS).order("creado",{ascending:false}).limit(3000),
    sb.from("seguimiento").select("*"),
    sb.from("config").select("valor").eq("clave","pin_inspectores").maybeSingle()
  ]);
  const err=v.error||i.error||s.error;
  if(err){toast("Error al cargar datos: "+errTxt(err));}
  S.vehiculos=v.data||[];
  S.insp=(i.data||[]).map(r=>({...r,vehiculoId:r.vehiculo_id,ts:Date.parse(r.creado)}));
  S.seg=Object.fromEntries((s.data||[]).map(r=>[r.inspeccion_id,{...r,actualizado:Date.parse(r.actualizado)}]));
  S.pinActual=c.data?.valor||"";
  S.adminLoaded=true;
}
let canal=null, recargaT=null;
function suscribir(){
  if(canal) return;

function ultimaDelMes(vehId,secId,mes){
  let best=null;
  for(const i of S.insp){ if(i.vehiculoId===vehId && i.seccion===secId && (i.fecha||"").startsWith(mes)){ if(!best || i.ts>best.ts) best=i; } }
  return best;
}

function exportCSV(rows){

  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`matriz-inspecciones-${S.mes}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function setView(v){
  const admin=v==="admin";
  $("#view-insp").hidden=admin; $("#view-admin").hidden=!admin;
  $("#nav-insp").setAttribute("aria-pressed",!admin); $("#nav-admin").setAttribute("aria-pressed",admin);
  ls.set("prevesa_view",admin?"admin":"insp");
  if(admin){ renderAdmin(); if(sb&&S.isAdmin&&!S.adminLoaded){await cargarAdmin();renderAdmin()} }
  else renderInsp();
}
$("#nav-insp").onclick=()=>setView("insp");
$("#nav-admin").onclick=()=>setView("admin");
$("#b-reload").onclick=async()=>{await cargarAdmin();renderAdmin();toast("Datos actualizados")};
$("#b-logout").onclick=async()=>{await sb.auth.signOut();if(canal){sb.removeChannel(canal);canal=null}S.session=null;S.isAdmin=false;S.adminLoaded=false;S.vehiculos=[];S.insp=[];S.seg={};$("#modal-root").innerHTML="";setView("insp");toast("Sesión cerrada")};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.confirmDel=null;renderAdmin()});

(async()=>{
  renderInsp();
  if(!sb) { if(ls.get("prevesa_view")==="admin") setView("admin"); return; }
  if(S.pin) pinEntrar(S.pin);
  await verificarAdmin(); S.adminMsg="";
  if(S.isAdmin){ suscribir(); }
  setView(ls.get("prevesa_view")==="admin"?"admin":"insp");
})();
</script>
</body>
</html>
